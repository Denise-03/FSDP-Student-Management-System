<body>
<div class="topline"></div>
<header class="studio-head"><div class="studio-mark"><span>FSDP / 01</span><div><strong>Shinju-Kai UI Design System</strong><small>Assignment 1 · Screen-by-screen visual reference · Not a working backend</small></div></div><div class="studio-tools"><button id="desktop" class="active" onclick="setDevice('desktop')">▣ Desktop</button><button id="mobile" onclick="setDevice('mobile')">▯ Mobile</button><button class="walk" onclick="go('home')">Start visitor journey ↗</button></div></header>
<div class="studio-layout"><aside class="studio-sidebar" id="studio-menu"></aside><main class="preview-wrap"><div class="preview-note"><div><strong id="screen-title">Public Homepage</strong><br><small id="screen-help">Browse all 29 proposed screens. Click buttons inside the preview to follow the flow.</small></div><span class="pill navy" id="screen-count">1 of 29</span></div><div class="preview-outer" id="preview-outer"><div class="site" id="site-content"></div></div></main></div>
<script>
const LOGO='https://aikidoshinjukai.com.sg/images/logo.png';
const groups=[
 {label:'PUBLIC WEBSITE',pages:[['home','Homepage'],['about','About Aikido'],['classes','Explore Classes'],['class-detail','Class Details'],['dojos','Dojo Finder'],['belts','Grading & Belts'],['fees','Fees'],['how-join','How to Join']]},
 {label:'AUTH & ENROLMENT',pages:[['login','Sign In'],['register','Create Account'],['application','Membership Application'],['status','Application Status']]},
 {label:'STUDENT PORTAL',pages:[['student','Student Dashboard'],['book','Book Classes'],['bookings','My Bookings'],['attendance','Attendance History'],['readiness','Grading Readiness'],['grading-apply','Grading Applications'],['notifications','Notifications'],['payments','Membership & Payments'],['profile','My Profile']]},
 {label:'INSTRUCTOR PORTAL',pages:[['instructor','Instructor Dashboard'],['roster','Class Attendance'],['student-progress','Student Progress'],['assessments','Grading Assessments']]},
 {label:'ADMIN PORTAL',pages:[['admin','Admin Dashboard'],['reviews','Application Reviews'],['members','Membership Records'],['reports','Centre Reports']]}
];
const pages=groups.flatMap(g=>g.pages.map(p=>({id:p[0],title:p[1],group:g.label})));
let current='home',device='desktop',approval=false,marked=false;
const btn=(label,to,cls='')=>`<button class="btn ${cls}" data-to="${to}">${label}</button>`;
const badge=(label,kind='')=>`<span class="pill ${kind}">${label}</span>`;
const input=(label,placeholder,type='text')=>`<div class="field"><label>${label}</label><input type="${type}" placeholder="${placeholder}" /></div>`;
const select=(label,items)=>`<div class="field"><label>${label}</label><select>${items.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
const box=(title,desc,action,kind='')=>`<div class="card"><h3>${title}</h3><p>${desc}</p>${action?`<div class="card-foot">${btn(action.label,action.to,kind)}</div>`:''}</div>`;
const fakeCard=(title,desc,icon='🥋',kind='illus-adult')=>`<div class="card"><div class="illustration ${kind}">${icon}</div><h3>${title}</h3><p>${desc}</p><div class="card-foot">${badge('All experience levels','navy')}${btn('View details','class-detail','smallbtn light')}</div></div>`;
function logo(){return `<div class="logo" data-to="home"><img class="brand-emblem" src="${LOGO}" alt="Official Aikido Shinju-Kai emblem" onerror="this.style.display='none'"/><div class="brand-copy"><b>AIKIDO SHINJU-KAI</b><small>THE ART OF HARMONY</small></div></div>`}
function header(){return `<div class="navbar">${logo()}<div class="nav-links"><button data-to="about">About Us</button><button data-to="classes">Classes</button><button data-to="dojos">Our Dojos</button><button data-to="belts">Grading</button><button data-to="how-join">How to Join</button></div><div class="nav-actions">${btn('Sign In','login','light smallbtn')}${btn('Join Now','register','red smallbtn')}</div><button class="nav-toggle" data-to="classes">☰</button></div>`}
function foot(){return `<footer class="simple-footer">${logo()}<span>Headquarters: 9 Sin Ming Road, #B1-02, Singapore 575630</span><span>Student project concept · Not an official ASK deployment</span></footer>`}

function home(){return publicPage(`<section class="hero"><div><div class="over">WELCOME TO AIKIDO SHINJU-KAI</div><h1>Discover strength through harmony.</h1><p>Explore authentic Aikido training, find your ideal dojo, and begin a connected journey from enrolment to grading.</p><div class="hero-actions">${btn('Explore Classes','classes','red')}${btn('How to Join','how-join','light')}</div><div class="hero-stats"><div><strong>1988</strong><small>Established</small></div><div><strong>60+</strong><small>Dojos worldwide</small></div><div><strong>All Ages</strong><small>Adult & children</small></div></div></div><div class="hero-image"><div class="hero-ring"><img src="${LOGO}" alt="Aikido Shinju-Kai official circular logo" onerror="this.style.display='none'" /></div></div></section><div class="feature-strip"><div class="feature"><span class="ico">⌁</span><div><b>Train across dojos</b><p>One membership, centralised training history.</p></div></div><div class="feature"><span class="ico">✓</span><div><b>Track your progress</b><p>Verified attendance and clear grading readiness.</p></div></div><div class="feature"><span class="ico">◉</span><div><b>Simple enrolment</b><p>Apply, receive updates, and book online.</p></div></div></div><section class="section max"><div class="section-head"><div><span class="over">TRAIN WITH US</span><h2>Find your class</h2></div>${btn('All classes →','classes','light smallbtn')}</div><div class="grid g3">${fakeCard('Adult Aikido','Suitable for ages 13 and above. Learn the art at your own pace.','🥋')}${fakeCard('Children’s Aikido','Build confidence, coordination and discipline with guided practice.','🌱','illus-child')}${fakeCard('Mixed / Family','A welcoming class setting for family members to learn together.','✦','illus-family')}</div></section><section class="section" style="background:#f5f8fb"><div class="max"><div class="section-head"><div><span class="over">MODERN MEMBERSHIP</span><h2>One seamless training journey</h2></div></div><div class="grid g3">${box('01 · Apply Online','Submit your membership application and required waiver details.',{label:'Start Application',to:'register'})}${box('02 · Train & Track','Book suitable classes and track instructor-verified attendance.',{label:'Student Dashboard',to:'student'})}${box('03 · Progress','Understand grading requirements and apply when eligible.',{label:'Grading Readiness',to:'readiness'})}</div></div></section>`)}
function about(){return publicPage(`${pageH('OUR HERITAGE','The Art of Peace','Aikido Shinju-Kai brings traditional Japanese martial arts principles into an inclusive training community in Singapore.')}<section class="section max"><div class="grid g2"><div class="detail-hero"><div class="over">OUR HISTORY</div><h2 style="margin:12px 0">Tradition since 1988</h2><p class="muted">Aikido Shinju-Kai was established in 1988 and is recognised by the Aikido World Headquarters in Japan. The organisation supports students across many training centres.</p><div style="margin-top:22px">${btn('Explore Our Dojos','dojos')}</div></div><div class="detail-hero" style="background:linear-gradient(145deg,#112d4c,#214969);color:#fff"><h2>“Harmony, discipline and lifelong learning.”</h2><p style="color:#d0e2f1;margin-top:18px">The public site is where prospective members learn about the philosophy, instructors, training options and progression system before enrolling.</p></div></div><div class="grid g3" style="margin-top:19px">${box('Our Philosophy','Introduce non-aggression, balance and respect in clear, accessible language.')}${box('Our Instructors','Present instructor profiles and the dojos where they lead classes.')}${box('Our History','Share the organisation’s heritage and milestones.')}</div></section>`)}
function classes(){return publicPage(`${pageH('FIND YOUR TRAINING','Explore Aikido Classes','Browse by class type, training centre and experience level. Everyone can view this page without logging in.')}<section class="section max"><div class="filters"><button class="filter active">All Classes</button><button class="filter">Adults</button><button class="filter">Children</button><button class="filter">Mixed / Family</button><button class="filter">Weapons</button><button class="filter">Advanced</button></div><div class="grid g3">${fakeCard('Adult Aikido','Train fundamentals and improve your technique in guided adult classes.','🥋')}${fakeCard('Children’s Aikido','Age-appropriate Aikido instruction for younger students.','🌱','illus-child')}${fakeCard('Mixed / Family','Parents and children can share a training session.','◈','illus-family')}${fakeCard('Weapons Class','Specialised weapons practice, subject to prerequisites.','⚔','illus-weapons')}${fakeCard('Ladies Class','Class session intended for women practitioners.','✧','illus-train')}${fakeCard('Advanced Aikido','Progressive training for eligible experienced members.','✦','illus-dojo')}</div><div class="side-caption">Real implementation: classes, instructors, schedules and capacities are fetched from SQL Server. Illustrative descriptions and visuals in this design preview do not replace the official class catalogue.</div></section>`)}
function detail(){return publicPage(`<section class="section max"><div class="backline">‹ <a data-to="classes">All Classes</a> / Adult Aikido</div><div class="grid g2"><div><div class="illustration illus-adult" style="height:330px;font-size:90px">🥋</div><div class="over" style="margin-top:17px">BEGINNER-FRIENDLY</div><h1 style="margin:7px 0 10px;color:var(--navy)">Adult Aikido Training</h1><p class="muted">A structured, welcoming introduction to Aikido. View available sessions, instructor details and dojo location before applying.</p><div style="margin-top:17px">${badge('13 years and above')}${badge('Skills & movement')}${badge('Instructor-led')}</div></div><div class="widecard" style="align-self:start"><h3>Select a training session</h3><div class="vstack"><div class="card"><div class="flex between"><div><b>Headquarters Dojo</b><p class="small muted">9 Sin Ming Road · Demo session</p></div>${badge('Spots available','good')}</div><p class="small" style="margin-top:7px">Wednesday · 6:00 PM</p></div><div class="card"><div class="flex between"><div><b>ActiveSG Bedok</b><p class="small muted">11 Bedok North Street 1 · Demo session</p></div>${badge('Spots available','good')}</div><p class="small" style="margin-top:7px">Sunday · 9:00 AM</p></div></div><div class="dash-space"></div>${btn('Book Selected Class →','login','red wide')}<div class="side-caption">Booking requires a signed-in, approved student. The selected class must survive sign-in, registration and membership review.</div></div></div></section>`)}
function dojos(){return publicPage(`${pageH('TRAINING CENTRES','Find Your Dojo','Discover participating training centres and choose the location that suits your schedule.')}<section class="section max"><div class="filters"><button class="filter active">All locations</button><button class="filter">North</button><button class="filter">East</button><button class="filter">West</button><button class="filter">Central</button></div><div class="grid g3">${[['ASK Headquarters','9 Sin Ming Road, #B1-02','Central','illus-dojo'],['ActiveSG Bedok','11 Bedok North Street 1','East','illus-adult'],['Our Tampines Hub','1 Tampines Walk','East','illus-family'],['ActiveSG Bishan','5 Bishan Street 14','Central','illus-train'],['West Coast Dojo','2 Clementi West Street 2','West','illus-child'],['ActiveSG Jurong East','21 Jurong East Street 31','West','illus-weapons']].map(x=>`<div class="card"><div class="illustration ${x[3]}">⌖</div><div class="flex between"><h3>${x[0]}</h3>${badge(x[2])}</div><p>📍 ${x[1]}</p><div class="card-foot">${btn('View sessions','classes','smallbtn light')}</div></div>`).join('')}</div><div class="side-caption">Some official dojos are temporarily closed or have eligibility restrictions. Working prototype must store active/closed flags and not offer unavailable sessions.</div></section>`)}
function belts(){return publicPage(`${pageH('GRADING INFORMATION','Understand Your Progress','Progression requires appropriate training, time in rank and other official prerequisites; the app shows your personalised progress once you become a student.')}<section class="section max"><div class="grid g2"><div class="widecard"><h3>Adult Belt Progression</h3><p class="muted small">Illustrative overview; precise requirements are configurable by belt and age group.</p><div style="margin:17px 0">${[['White / beginner','#fff'],['6th Kyu · Blue','#4b89bf'],['5th Kyu · Blue-Gold','#edca79'],['4th Kyu · Brown','#7a543b'],['3rd Kyu · Brown-Gold','#a37640'],['2nd Kyu · Black','#1f2a36'],['1st Kyu · Black-Gold','#d7b36a']].map(x=>`<div class="flex" style="padding:8px 0;border-bottom:1px solid #edf0f4"><span style="height:17px;width:50px;background:${x[1]};border:1px solid #bdc5cf;border-radius:3px"></span><b class="small">${x[0]}</b></div>`).join('')}</div></div><div class="widecard"><h3>How grading works</h3><div class="steps" style="margin-top:22px"><div class="step"><div class="number">1</div><div><b>Attend training</b><p>Your instructor verifies sessions across eligible dojos.</p></div></div><div class="step"><div class="number">2</div><div><b>Meet official requirements</b><p>Minimum sessions, time in rank and any other conditions.</p></div></div><div class="step"><div class="number">3</div><div><b>Receive eligibility notification</b><p>Apply to an available grading event when eligible.</p></div></div><div class="step"><div class="number">4</div><div><b>Instructor assessment</b><p>Assessment is submitted for further processing; no automatic belt promotion.</p></div></div></div><div style="margin-top:22px">${btn('See My Grading Progress','readiness')}</div></div></div><div class="note" style="margin-top:18px">For actual grade thresholds and dates, administrators must maintain verified, source-based rules rather than using this visual chart as authoritative grading policy.</div></section>`)}
function fees(){return publicPage(`${pageH('MEMBERSHIP & FEES','Plan Your Training','See membership and training costs before applying. Costs below are examples from official public pricing and should be reviewed before launch.')}<section class="section max"><div class="grid g3"><div class="card"><span class="over">ONE-TIME REGISTRATION</span><div class="price" style="margin:14px 0">S$60</div><p>Official published one-time registration fee; check current policies before collecting payment.</p><div class="card-foot">${btn('Apply for Membership','register','red')}</div></div><div class="card"><span class="over">ANNUAL MEMBERSHIP</span><div class="price" style="margin:14px 0">S$48</div><p>Annual membership fee as listed on the official public fee page.</p><div class="card-foot">${btn('Membership Details','payments','light')}</div></div><div class="card"><span class="over">ADULT LESSON PASS</span><div class="price" style="margin:14px 0">S$270</div><p>Illustrative published 10-lesson adult pass; eligibility and validity apply.</p><div class="card-foot">${btn('View Classes','classes','light')}</div></div></div><div class="note warn" style="margin-top:18px">Real app: keep fees editable in the database. Never simulate successful Stripe payments. Use test mode and validated webhook events if checkout is implemented.</div></section>`)}
function how(){return publicPage(`${pageH('MEMBERSHIP ENROLMENT','Your Journey Begins Here','We are replacing the paper-based application workflow with clear online steps and status tracking.')}<section class="section max"><div class="grid g2"><div class="widecard"><h3>How to become a member</h3><div class="steps" style="margin-top:19px">${[['1','Explore classes & choose your principal dojo','No account needed to discover our training.'],['2','Create your secure account','Sign in or register when you are ready to enrol.'],['3','Complete the membership application','Provide details, acknowledge waiver and upload appropriate evidence.'],['4','Receive an application decision','Admin may approve, reject or request corrections.'],['5','Book a suitable class','Approved students can join eligible training sessions.']].map(x=>`<div class="step"><div class="number">${x[0]}</div><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</div><div style="margin-top:22px">${btn('Start Online Application','register','red')}</div></div><div class="widecard"><h3>Before you apply</h3><div class="vstack" style="margin-top:15px"><div class="note">✓ Choose your principal dojo</div><div class="note">✓ Review training fees and membership terms</div><div class="note">✓ Prepare any legitimate proof of previous Aikido training</div><div class="note">✓ Review the required waiver and guardian requirements</div></div><div class="side-caption">For the school demo, upload only synthetic or redacted files. Do not collect real Singpass PDFs, NRIC or other identity documents.</div></div></div></section>`)}
function authPage(mode){let reg=mode==='register';return `${header()}<div class="auth-wrap"><div class="auth-card">${logo()}<div class="over">${reg?'CREATE YOUR ACCOUNT':'WELCOME BACK'}</div><h2>${reg?'Start your Aikido journey':'Sign in to your account'}</h2><p>${reg?'Create an account before submitting a membership application.':'Continue your membership, training and grading journey.'}</p>${reg?`${input('Full name','Your full name')}${input('Email address','you@example.com','email')}`:`${input('Email address','you@example.com','email')}`}${input('Password','Enter your password','password')}${reg?`${input('Confirm password','Re-enter password','password')}<div class="note">After creating an account, you will complete your membership application for admin review.</div><div class="dash-space"></div>${btn('Create Account →','application','red wide')}`:`<div class="flex between small" style="margin-bottom:15px"><span><input type="checkbox" /> Remember me</span><a class="muted" href="#login">Forgot password?</a></div>${btn('Sign In →','status','wide')}`}<div style="text-align:center;margin-top:19px" class="small muted">${reg?'Already have an account?':'New to Aikido Shinju-Kai?'} <button class="linkbtn" data-to="${reg?'login':'register'}">${reg?'Sign In':'Create an Account'}</button></div><div class="side-caption">These controls demonstrate the visual design only. Codex must implement secure server-side authentication, role-based sessions and validation.</div></div></div>${foot()}`}
function application(){return `${header()}<div class="auth-wrap"><div class="auth-card" style="width:min(100%,670px)"><div class="flex between"><div><div class="over">ONLINE ENROLMENT</div><h2>Membership Application</h2><p>Tell us about yourself so your application can be reviewed.</p></div>${badge('Step 2 of 4','navy')}</div><div class="barsteps"><span class="on"></span><span class="on"></span><span></span><span></span></div><h3 style="margin-bottom:16px">Training Background & Principal Dojo</h3><div class="formrow">${select('Your experience',['I am new to Aikido','I have trained before'])}${select('Current belt (if applicable)',['Beginner / no grade','6th Kyu','5th Kyu','4th Kyu','Other — verification required'])}</div><div class="formrow">${select('Preferred principal dojo',['ASK Headquarters','ActiveSG Bedok','Our Tampines Hub','West Coast Dojo'])}${select('Preferred class',['Adult Aikido','Children’s Aikido','Mixed / Family','Other'])}</div><div class="field"><label>Previous training information (optional)</label><textarea rows="2" placeholder="Previous organisation, dojo or years trained"></textarea></div><div class="upload">☁ Upload supporting training evidence (optional)<br><small>PDF/JPG/PNG; synthetic or redacted demo files only</small></div><div class="note warn" style="margin-top:14px">Before submission, student/guardian must acknowledge the required waiver, membership terms and privacy notice. Claimed belt levels remain unverified until reviewed.</div><div class="flex between" style="margin-top:17px">${btn('← Back','register','light')}${btn('Submit Demo Application →','status','red')}</div></div></div>${foot()}`}
function status(){return `${header()}<div class="auth-wrap"><div class="auth-card" style="width:min(100%,600px)"><div class="flex between"><div><div class="over">APPLICATION TRACKING</div><h2>Your Membership Application</h2></div>${badge(approval?'Approved':'Under Review',approval?'good':'warn')}</div><p>Your application was received. You can view updates here without contacting the office.</p><div class="note ${approval?'good':''}">${approval?'Your application has been approved in this visual preview. The real platform will create an active membership and allow eligible bookings.':'Your application is waiting for an administrator to verify the submitted information and waiver.'}</div><div class="timeline"><div class="done"><b>Application submitted</b><p>Reference: ASK-DEMO-1042</p></div><div class="${approval?'done':''}"><b>Administrative review</b><p>Details and supporting evidence are checked.</p></div><div class="${approval?'done':''}"><b>Membership activation</b><p>A decision notification and member record are generated.</p></div></div><div class="flex">${btn('View Member Portal','student',approval?'red':'light')}${btn('Review as Admin','reviews')}</div><div class="side-caption">Demo preview: use the Admin Application Reviews screen to simulate approval. The production implementation must save changes to SQL Server and send a real in-app notification.</div></div></div>${foot()}`}
const studentLinks=[['student','▦','Overview'],['book','▤','Book a class'],['bookings','▣','My bookings'],['attendance','◷','Attendance'],['readiness','◇','Grading readiness'],['grading-apply','✉','Grading applications'],['notifications','◉','Notifications'],['payments','▥','Membership & payments'],['profile','♙','My profile']];
const instructorLinks=[['instructor','▦','Overview'],['roster','▤','Take attendance'],['student-progress','◇','Student progress'],['assessments','✎','Grading assessments']];
const adminLinks=[['admin','▦','Overview'],['reviews','☷','Enrolment reviews'],['members','♙','Membership records'],['reports','▥','Centre reports']];
function sideNav(kind){let links=kind==='student'?studentLinks:kind==='instructor'?instructorLinks:adminLinks;return `<aside class="dash-side">${logo()}<div class="navgroup">${kind.toUpperCase()} PORTAL</div>${links.map(x=>`<button data-to="${x[0]}" class="${current===x[0]?'on':''}"><span style="font-size:16px;width:18px">${x[1]}</span>${x[2]}</button>`).join('')}<div class="navgroup">QUICK LINKS</div><button data-to="home">⌂ &nbsp;Public site</button><button data-to="login">⇥ &nbsp;Sign out (preview)</button></aside>`}
function mobileBottom(kind){let links=kind==='student'?['student','book','attendance','readiness','profile']:kind==='instructor'?['instructor','roster','student-progress','assessments']:['admin','reviews','members','reports'];const labels={student:'Home',book:'Classes',attendance:'History',readiness:'Grading',profile:'Me',instructor:'Home',roster:'Attendance','student-progress':'Progress',assessments:'Assess',admin:'Home',reviews:'Review',members:'Members',reports:'Reports'};const icons={student:'⌂',book:'▤',attendance:'◷',readiness:'◇',profile:'♙',instructor:'⌂',roster:'✓','student-progress':'◇',assessments:'✎',admin:'⌂',reviews:'☷',members:'♙',reports:'▥'};return `<nav class="phone-bottom">${links.map(k=>`<button data-to="${k}" style="${current===k?'color:#0b2b49;font-weight:800':''}"><span style="font-size:17px">${icons[k]}</span>${labels[k]}</button>`).join('')}</nav>`}
function dash(kind,subtitle,body){return `<div class="dash">${sideNav(kind)}<div><main class="dash-main"><div class="dash-top"><div><h2>${pages.find(x=>x.id===current)?.title||'Dashboard'}</h2><p>${subtitle}</p></div><div class="flex"><span class="pill navy">${kind==='student'?'Active student':kind==='instructor'?'Instructor':'Admin'}</span><div class="avatar">${kind==='student'?'JL':kind==='instructor'?'RN':'AD'}</div></div></div>${body}</main>${mobileBottom(kind)}</div></div>`}
function stats(items){return `<div class="grid g4">${items.map(x=>`<div class="kpi"><div class="num">${x[0]}</div><p>${x[1]}</p><small>${x[2]||'Across training centres'}</small></div>`).join('')}</div>`}
function listing(rows,heads){return `<div class="tablewrap"><table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<b>${c}</b>`:c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function student(){return dash('student','Welcome back, Jamie. Here is your training at a glance.',`${stats([['20','Verified sessions','Across 2 dojos'],['2','Upcoming bookings','Next 7 days'],['6th','Current Kyu','Blue belt · demo'],['100%','Grading progress','Demo configuration']])}<div class="dash-space"></div><div class="grid g2"><div class="widecard" style="background:linear-gradient(125deg,#102c4a,#1c4e6f);color:#fff"><div class="flex between"><span class="over" style="color:#b7ccd9">YOUR MEMBERSHIP</span>${badge('Active','good')}</div><h2 style="font-size:28px;margin:12px 0">Jamie Lim</h2><p style="font-size:12px;color:#c9dce8">ASK-2026-0042 · Principal dojo: Headquarters</p><div style="margin-top:20px">${btn('Membership Details','payments','light smallbtn')}</div></div><div class="widecard"><div class="flex between"><h3>Grading readiness</h3>${badge('Eligible','good')}</div><p class="muted small">Illustrative rule: sessions and time-in-rank both met</p><div class="flex between" style="margin:19px 0 7px"><b>Verified attendance</b><b>20 / 20</b></div><div class="progress"><span style="width:100%"></span></div><div style="margin-top:22px">${btn('View grading opportunities','grading-apply','smallbtn')}</div></div></div><div class="dash-space"></div><div class="grid g2"><div class="widecard"><div class="titlebar"><h3>Upcoming Classes</h3>${btn('Browse more','book','smallbtn light')}</div>${[['Headquarters','Wed · 18:00'],['ActiveSG Bedok','Sun · 09:00']].map(x=>`<div class="roster-item"><div><b>${x[0]}</b><p class="small muted">Adult Aikido · ${x[1]}</p></div>${badge('Booked','good')}</div>`).join('')}</div><div class="widecard"><h3>Latest Updates</h3><div class="roster-item"><span>✓ Your grading criteria are satisfied</span>${badge('New','good')}</div><div class="roster-item"><span>✓ Attendance recorded for ActiveSG Bedok</span>${badge('Verified')}</div><div style="margin-top:13px">${btn('View notifications','notifications','light smallbtn')}</div></div></div>`)}
function book(){return dash('student','Find a suitable class across available Aikido Shinju-Kai dojos.',`<div class="filters"><button class="filter active">All classes</button><button class="filter">Adult</button><button class="filter">Mixed / Family</button><button class="filter">My belt level</button></div><div class="grid g3">${[['Adult Aikido','ASK Headquarters','Wednesday · 18:00','Instructor Robin Tan'],['Mixed / Family','ActiveSG Bedok','Sunday · 09:00','Assigned instructor'],['Adult Aikido','Our Tampines Hub','Monday · 20:30','Assigned instructor'],['Adult Aikido','ActiveSG Bishan','Thursday · 19:30','Assigned instructor'],['Adult Aikido','West Coast Dojo','Saturday · 16:00','Assigned instructor'],['Mixed Training','ActiveSG Seng Kang','Sunday · 13:30','Assigned instructor']].map(x=>`<div class="widecard"><div class="flex between">${badge('Suitable','good')}${badge('Demo')}</div><h3 style="font-size:17px;margin-top:12px">${x[0]}</h3><p class="small muted" style="margin:7px 0">⌖ ${x[1]}</p><p class="small">◷ ${x[2]}</p><p class="tiny muted" style="margin:9px 0">${x[3]}</p>${btn('Book session','bookings','red wide smallbtn')}</div>`).join('')}</div><div class="side-caption">Production booking must validate approved membership, waiver, capacity, class level, schedule conflicts and duplicate registrations on the server.</div>`)}

function roster(){return dash('instructor','Record accurate attendance for assigned training sessions.',`<div class="widecard"><div class="flex between"><div><h3>Adult Aikido · Headquarters</h3><p class="small muted">Demo class · 06 Nov 2026 · 18:00 · 4 enrolled students shown</p></div>${badge(marked?'Saved (preview)':'Not yet saved',marked?'good':'warn')}</div><div class="dash-space"></div>${[['Jamie Lim','6th Kyu'],['Alex Tan','Beginner'],['Sam Lee','5th Kyu'],['Morgan Koh','6th Kyu']].map((x,i)=>`<div class="roster-item"><div class="flex"><div class="avatar">${x[0].split(' ').map(y=>y[0]).join('')}</div><div><b>${x[0]}</b><p class="tiny muted">${x[1]}</p></div></div><div class="choice"><button class="good" data-demo="present">✓ Present</button><button class="bad" data-demo="absent">✕ Absent</button></div></div>`).join('')}<div class="flex between" style="margin-top:19px"><p class="small muted">Every update must be tied to class, student, dojo and instructor.</p><button class="btn red" data-demo="save-attendance">Save Attendance</button></div></div><div class="note" style="margin-top:17px">In production, only an assigned instructor can save attendance. Saving again updates the same record instead of counting an extra session.</div>`)}
function studentProgress(){return dash('instructor','Follow attendance trends and identify students ready for grading.',`<div class="grid g3">${[['Jamie Lim','6th Kyu','20/20',100,'Eligible'],['Alex Tan','Beginner','18/20',90,'Nearly ready'],['Sam Lee','5th Kyu','17/20',85,'In progress']].map(x=>`<div class="widecard"><div class="flex between"><h3>${x[0]}</h3>${badge(x[4],x[4]==='Eligible'?'good':'warn')}</div><p class="small muted">Verified grade: ${x[1]}</p><div class="flex between" style="margin:18px 0 8px"><b>Training sessions</b><b>${x[2]}</b></div><div class="progress"><span style="width:${x[3]}%"></span></div><p class="small muted" style="margin-top:15px">Includes attendance at more than one dojo</p></div>`).join('')}</div><div class="dash-space"></div><div class="widecard"><div class="flex between"><h3>Attendance Overview</h3>${badge('Demo data')}</div>${listing([['Jamie Lim','Headquarters + Bedok','20',badge('Eligible','good')],['Alex Tan','Headquarters','18',badge('Near eligibility','warn')],['Sam Lee','Our Tampines Hub','17',badge('In progress')]],['Student','Dojo(s)','Verified sessions','Grading status'])}</div>`)}
function assessments(){return dash('instructor','Record assessments for eligible grading applicants, without issuing final belt promotions.',`<div class="grid g2"><div class="widecard"><div class="flex between"><h3>Candidate Assessment</h3>${badge('Draft','warn')}</div><div style="margin-top:16px">${select('Grading candidate',['Jamie Lim · 6th → 5th Kyu','Other assigned applicants'])}${select('Result',['Select assessment result','Pass recommendation','Needs further training'])}${input('Time in rank','e.g. 4 months')}<div class="field"><label>Instructor feedback</label><textarea rows="4" placeholder="Observations about technique, control and readiness"></textarea></div><div class="field"><label>Digital sign-off (demo)</label><input placeholder="Instructor full name / approved signature flow" /></div><div class="flex">${btn('Save Draft','assessments','light smallbtn')}${btn('Submit Assessment','assessments','red smallbtn')}</div></div><div class="widecard"><h3>Assessment Guidelines</h3><div class="steps" style="margin-top:15px"><div class="step"><span class="number">1</span><div><b>Review grading registration</b><p>Only candidates assigned to the correct session.</p></div></div><div class="step"><span class="number">2</span><div><b>Record result and feedback</b><p>Document the assessment against criteria.</p></div></div><div class="step"><span class="number">3</span><div><b>Sign and submit</b><p>Submission is attributed to authenticated instructor.</p></div></div><div class="step"><span class="number">4</span><div><b>Forward for processing</b><p>No in-scope automated promotion approval.</p></div></div></div></div></div>`)}
function admin(){return dash('admin','Review new enrolments and monitor membership across dojos.',`${stats([['12','Pending applications','Needs review'],['48','Active members','Demo seed data'],['5','Approved today','Demo metric'],['4','Participating dojos','Demo seed data']])}<div class="dash-space"></div><div class="grid g2"><div class="widecard"><div class="titlebar"><h3>Recent Applications</h3>${btn('Open review queue','reviews','smallbtn light')}</div>${[['Alex Tan','Beginner','Pending review'],['Morgan Koh','Returning student','Changes requested'],['Jamie Lim','Existing member','Approved']].map(x=>`<div class="roster-item"><div><b>${x[0]}</b><p class="tiny muted">${x[1]}</p></div>${badge(x[2],x[2]==='Approved'?'good':'warn')}</div>`).join('')}</div><div class="widecard"><h3>Monthly Membership Trend</h3><p class="tiny muted">Illustrative chart generated from demo seed data</p><div class="chart-bars">${[39,53,42,67,57,71,63,84].map(x=>`<span style="height:${x}%"></span>`).join('')}</div><div class="flex between tiny muted" style="margin-top:7px"><span>Apr</span><span>Nov</span></div><div style="margin-top:14px">${btn('View Centre Reports','reports','light smallbtn')}</div></div></div><div class="dash-space"></div><div class="widecard"><h3>Core Administration Tasks</h3><div class="grid g3">${box('Review enrolment','Review profiles, previous experience and waiver before approval.',{label:'Review Queue',to:'reviews'})}${box('Search members','Find a member and view their assigned dojo and status.',{label:'Member Records',to:'members'})}${box('Monitor training','See membership and attendance summaries across centres.',{label:'Reports',to:'reports'})}</div></div>`)}
function reviews(){return dash('admin','Verify applications and create memberships only after approval.',`<div class="grid g2"><div class="widecard"><div class="flex between"><h3>Application Queue</h3>${badge(approval?'Approval simulated':'3 pending','warn')}</div>${[['Alex Tan','ASK-DEMO-1042',approval?'Approved':'Pending review'],['Morgan Koh','ASK-DEMO-1041','Changes requested'],['Cindy Lee','ASK-DEMO-1040','Pending review']].map(x=>`<div class="roster-item"><div><b>${x[0]}</b><p class="tiny muted">${x[1]}</p></div>${badge(x[2],x[2]==='Approved'?'good':'warn')}</div>`).join('')}<div class="side-caption">Selecting an application opens verified data and a private document viewer. The demo profile appears on the right.</div></div><div class="widecard"><div class="flex between"><h3>Review · Alex Tan</h3>${badge(approval?'Approved':'Pending review',approval?'good':'warn')}</div><div class="roster-item"><b>Experience</b><span>Beginner</span></div><div class="roster-item"><b>Preferred dojo</b><span>Headquarters</span></div><div class="roster-item"><b>Waiver</b>${badge('Acknowledged','good')}</div><div class="roster-item"><b>Evidence</b><span>None required for beginner</span></div><div class="note warn" style="margin-top:14px">Optional verification material is private to authorised reviewers. Do not use real Singpass or identity documents for the demo.</div><div class="flex" style="margin-top:17px;flex-wrap:wrap"><button class="btn red" data-demo="approve">✓ Approve</button><button class="btn light" data-demo="changes">Request changes</button><button class="btn light" data-demo="reject">Reject</button></div></div></div><div class="dash-space"></div><div class="widecard"><h3>What approval does</h3><div class="steps"><div class="step"><span class="number">1</span><div><b>Update application status</b><p>Reviewed by, timestamp, reason and decision are stored.</p></div></div><div class="step"><span class="number">2</span><div><b>Activate membership</b><p>Create student profile with assigned principal dojo.</p></div></div><div class="step"><span class="number">3</span><div><b>Notify applicant</b><p>Send enrolment status and next steps to student portal.</p></div></div></div></div>`)}
function members(){return dash('admin','Search verified membership records and assignment to training centres.',`<div class="widecard"><div class="flex between" style="margin-bottom:15px"><h3>Membership Directory</h3>${badge('Role-restricted','navy')}</div><div class="filters"><input style="border:1px solid #dde5ed;padding:10px 12px;border-radius:8px;min-width:210px" placeholder="Search name or member ID"/><button class="filter active">All</button><button class="filter">Active</button><button class="filter">Pending</button></div>${listing([['Jamie Lim','ASK-2026-0042','Headquarters','6th Kyu',badge('Active','good')],['Sam Lee','ASK-2026-0038','ActiveSG Bedok','5th Kyu',badge('Active','good')],['Alex Tan',approval?'ASK-DEMO-1042':'Not assigned','Headquarters','Unverified',badge(approval?'Active':'Pending',approval?'good':'warn')]],['Student','Member ID','Principal Dojo','Belt','Status'])}</div><div class="side-caption">Real system must protect student identity, avoid exposing supporting documents to instructors who do not need them, and log administrative changes.</div>`)}
function reports(){return dash('admin','Monitor attendance and membership metrics across participating training centres.',`<div class="grid g2"><div class="widecard"><h3>Attendance by Dojo</h3><p class="tiny muted" style="margin-bottom:15px">Sample November data · not live metrics</p>${[['Headquarters',85],['ActiveSG Bedok',69],['Our Tampines Hub',58],['West Coast',43]].map(x=>`<div style="margin:14px 0"><div class="flex between small"><b>${x[0]}</b><span>${x[1]} verified sessions</span></div><div class="progress" style="margin-top:7px"><span style="width:${x[1]}%"></span></div></div>`).join('')}</div><div class="widecard"><h3>Student Engagement</h3><p class="small muted">Attendance trends help instructors follow up with students whose verified activity is declining.</p><div class="grid g2" style="margin-top:19px"><div class="kpi"><div class="num">12</div><p>New applications</p></div><div class="kpi"><div class="num">6</div><p>Needs follow-up</p></div></div><div class="dash-space"></div>${btn('View Instructor Progress','student-progress','light smallbtn')}</div></div><div class="dash-space"></div><div class="widecard"><h3>Cross-Dojo Consolidation</h3>${listing([['Jamie Lim','Headquarters','12'],['Jamie Lim','ActiveSG Bedok','8'],['Sam Lee','Our Tampines Hub','17']],['Student','Training Dojo','Verified sessions'])}</div>`)}
const renderers={home,about,classes,'class-detail':detail,dojos,belts,fees,'how-join':how,login:()=>authPage('login'),register:()=>authPage('register'),application,status,student,book,bookings,attendance,readiness,'grading-apply':gradingApply,notifications,payments,profile,instructor,roster,'student-progress':studentProgress,assessments,admin,reviews,members,reports};
function render(){let p=pages.find(x=>x.id===current)||pages[0];document.getElementById('screen-title').textContent=p.title;document.getElementById('screen-count').textContent=`${pages.findIndex(x=>x.id===current)+1} of ${pages.length}`;document.getElementById('site-content').innerHTML=renderers[current]();document.getElementById('studio-menu').innerHTML=groups.map(g=>`<div class="group"><div class="groupname">${g.label}</div>${g.pages.map(x=>`<button class="${current===x[0]?'active':''}" data-to="${x[0]}">${x[1]}</button>`).join('')}</div>`).join('');document.title=`${p.title} · Aikido Shinju-Kai FSDP Design`;}
function go(id){if(!renderers[id])return;current=id;history.replaceState(null,'','#'+id);render();if(window.innerWidth>1000)window.scrollTo({top:0,behavior:'smooth'});}
function setDevice(d){device=d;document.getElementById('preview-outer').className='preview-outer '+(d==='mobile'?'mobile':'');document.getElementById('desktop').classList.toggle('active',d==='desktop');document.getElementById('mobile').classList.toggle('active',d==='mobile');}
function demoAction(action){if(action==='approve'){approval=true;render();alert('Visual preview: Alex approved. Open Application Status to see the updated preview. Codex must implement a database transaction and notification.')}else if(action==='save-attendance'){marked=true;render();alert('Visual preview only: attendance appears saved. Codex must implement persistent, audited attendance records.')}else if(action==='present'||action==='absent'){alert('Preview: use these choices to plan roster interaction. Full implementation must persist each student\'s attendance.')}else{alert('This is a static design preview. Codex must implement this action with backend APIs and SQL Server.')}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-to]');if(nav){e.preventDefault();go(nav.dataset.to);return}const demo=e.target.closest('[data-demo]');if(demo){e.preventDefault();demoAction(demo.dataset.demo);}});
let first=(location.hash||'').replace('#','');if(renderers[first])current=first;render();
if(window.innerWidth<700)setDevice('mobile');
</script>
